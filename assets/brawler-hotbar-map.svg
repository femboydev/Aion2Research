<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">FemboyDev Brawler PvE hotbar map</title>
  <desc id="desc">A key-by-key Brawler hotbar recommendation. Basic attacks use mouse clicks, damage and burst skills use keys one through four, utility uses Q, R, T and F, and a free key is reserved for the filler macro.</desc>
  <rect width="1440" height="900" rx="28" fill="#f7f2fb"/>
  <rect x="24" y="24" width="1392" height="852" rx="22" fill="none" stroke="#d9cbe7" stroke-width="2"/>
  <text x="64" y="78" fill="#765395" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4">FEMBOYDEV  /  BUILD SHEET 001-A</text>
  <text x="64" y="137" fill="#2b2034" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">BRAWLER HOTBAR MAP</text>
  <text x="64" y="174" fill="#57465f" font-family="Segoe UI, Arial, sans-serif" font-size="20">Boss PvE layout · keep burst, block and movement on direct inputs</text>

  <rect x="64" y="218" width="1312" height="185" rx="18" fill="#fff" stroke="#d9cbe7" stroke-width="2"/>
  <text x="94" y="260" fill="#765395" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ATTACK CYCLE</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="96" y="286" width="210" height="78" rx="12" fill="#f5edf9" stroke="#a987d5" stroke-width="2"/>
    <text x="116" y="316" fill="#765395" font-size="15" font-weight="700">LEFT CLICK</text>
    <text x="116" y="348" fill="#2b2034" font-size="24" font-weight="700">Flurry</text>
    <rect x="326" y="286" width="210" height="78" rx="12" fill="#f5edf9" stroke="#a987d5" stroke-width="2"/>
    <text x="346" y="316" fill="#765395" font-size="15" font-weight="700">RIGHT CLICK</text>
    <text x="346" y="348" fill="#2b2034" font-size="24" font-weight="700">Roundhouse</text>
    <path d="M550 325h58" stroke="#a987d5" stroke-width="4" stroke-linecap="round"/>
    <path d="M597 315l12 10-12 10" fill="none" stroke="#a987d5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="625" y="286" width="250" height="78" rx="12" fill="#f5edf9" stroke="#a987d5" stroke-width="2"/>
    <text x="647" y="316" fill="#765395" font-size="15" font-weight="700">KEY 1</text>
    <text x="647" y="348" fill="#2b2034" font-size="24" font-weight="700">Chain Fist</text>
    <text x="920" y="316" fill="#765395" font-size="15" font-weight="700">HOLD MACRO KEY</text>
    <text x="920" y="348" fill="#2b2034" font-size="23" font-weight="700">Flurry → Roundhouse → Chain Fist</text>
  </g>

  <text x="64" y="456" fill="#765395" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">DIRECT DAMAGE KEYS</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="476" width="300" height="110" rx="16" fill="#fff" stroke="#d9cbe7" stroke-width="2"/>
    <rect x="86" y="495" width="52" height="52" rx="10" fill="#4a355d"/>
    <text x="103" y="530" fill="#fff" font-size="24" font-weight="700">2</text>
    <text x="158" y="518" fill="#2b2034" font-size="22" font-weight="700">Exploding Fist</text>
    <text x="158" y="550" fill="#57465f" font-size="16">Rage recovery + burst hit</text>

    <rect x="384" y="476" width="300" height="110" rx="16" fill="#fff" stroke="#d9cbe7" stroke-width="2"/>
    <rect x="406" y="495" width="52" height="52" rx="10" fill="#765395"/>
    <text x="423" y="530" fill="#fff" font-size="24" font-weight="700">3</text>
    <text x="478" y="518" fill="#2b2034" font-size="22" font-weight="700">Rampage</text>
    <text x="478" y="550" fill="#57465f" font-size="16">Manual start; 15-second cooldown</text>

    <rect x="704" y="476" width="300" height="110" rx="16" fill="#fff" stroke="#d9cbe7" stroke-width="2"/>
    <rect x="726" y="495" width="52" height="52" rx="10" fill="#765395"/>
    <text x="743" y="530" fill="#fff" font-size="24" font-weight="700">4</text>
    <text x="798" y="518" fill="#2b2034" font-size="22" font-weight="700">Ascending Blow</text>
    <text x="798" y="550" fill="#57465f" font-size="16">Manual Martial Arts hit</text>

    <rect x="1024" y="476" width="352" height="110" rx="16" fill="#fff" stroke="#e49bb9" stroke-width="2"/>
    <rect x="1046" y="495" width="52" height="52" rx="10" fill="#d88daa"/>
    <text x="1063" y="530" fill="#fff" font-size="24" font-weight="700">1</text>
    <text x="1118" y="518" fill="#2b2034" font-size="22" font-weight="700">Chain Fist</text>
    <text x="1118" y="550" fill="#57465f" font-size="16">Frequent damage; macro-safe filler</text>
  </g>

  <text x="64" y="636" fill="#765395" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">BUFFS, DEFENSE AND MOVEMENT</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="656" width="250" height="88" rx="14" fill="#eee4f6"/>
    <text x="86" y="686" fill="#765395" font-size="16" font-weight="700">Q</text>
    <text x="86" y="720" fill="#2b2034" font-size="21" font-weight="700">Ferocity</text>
    <rect x="330" y="656" width="250" height="88" rx="14" fill="#eee4f6"/>
    <text x="352" y="686" fill="#765395" font-size="16" font-weight="700">R</text>
    <text x="352" y="720" fill="#2b2034" font-size="21" font-weight="700">Phantom</text>
    <rect x="596" y="656" width="250" height="88" rx="14" fill="#eee4f6"/>
    <text x="618" y="686" fill="#765395" font-size="16" font-weight="700">T</text>
    <text x="618" y="720" fill="#2b2034" font-size="21" font-weight="700">Pulverize</text>
    <rect x="862" y="656" width="250" height="88" rx="14" fill="#f7eaf1"/>
    <text x="884" y="686" fill="#a65373" font-size="16" font-weight="700">F</text>
    <text x="884" y="720" fill="#2b2034" font-size="21" font-weight="700">Focused Block</text>
    <rect x="1128" y="656" width="248" height="88" rx="14" fill="#f7eaf1"/>
    <text x="1150" y="686" fill="#a65373" font-size="16" font-weight="700">SIDE BUTTONS</text>
    <text x="1150" y="720" fill="#2b2034" font-size="18" font-weight="700">Shoulder Tackle · Defiance</text>
  </g>

  <rect x="64" y="778" width="1312" height="58" rx="14" fill="#4a355d"/>
  <text x="88" y="814" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">MACRO BIND:</text>
  <text x="230" y="814" fill="#f4dbe7" font-family="Segoe UI, Arial, sans-serif" font-size="18">E if free, otherwise an unused mouse side button. Keep Rampage, burst hits and Focused Block manual.</text>
</svg>
